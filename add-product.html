<!DOCTYPE html>
<html lang="bn">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>সুপারি যোগ করুন | STMS</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<nav class="navbar"><div class="logo">STMS</div><div class="nav-links">
<a href="index.html">হোম</a><a href="dashboard.html">ড্যাশবোর্ড</a><a href="products.html">পণ্যসমূহ</a><a href="orders.html">আমার অর্ডার</a><a href="#" onclick="logout();return false">লগআউট</a>
</div></nav>
<section class="register-section"><div class="register-container">
<h1>🌰 সুপারি যোগ করুন</h1><p class="register-subtitle">আপনার সুপারি বাজারে বিক্রির জন্য যোগ করুন</p>
<div class="alert-strip" style="margin-bottom:20px">💡 <span>সঠিক মজুদ ও দাম দিলে ক্রেতারা সহজে আপনার পণ্য খুঁজে পাবে।</span></div>
<form id="productForm">
<div class="form-group"><label for="type">🏷️ সুপারির ধরন</label><select id="type" required><option value="">ধরন নির্বাচন করুন</option><option value="Fresh Supari">কাঁচা সুপারি</option><option value="Dried Supari">শুকনা সুপারি</option><option value="Processed Supari">প্রক্রিয়াজাত সুপারি</option></select></div>
<div class="form-grid-2"><div class="form-group"><label for="quantity">📦 মজুদ (KG)</label><input type="number" id="quantity" min="1" step="1" placeholder="যেমন: ১০০" required><div class="form-help">আপনার কাছে যত KG আছে</div></div>
<div class="form-group"><label for="pricePerKg">💰 প্রতি KG দাম (৳)</label><input type="number" id="pricePerKg" min="1" step="1" placeholder="যেমন: ৩৫০" required><div class="form-help">ক্রেতার জন্য বিক্রয়মূল্য</div></div></div>
<div class="form-group"><label for="location">📍 পণ্যের স্থান</label><input type="text" id="location" placeholder="যেমন: বরিশাল সদর" required></div>
<div class="form-group"><label for="description">📝 পণ্যের বর্ণনা</label><textarea id="description" placeholder="যেমন: ভালো মানের শুকনা সুপারি"></textarea></div>
<button type="submit" class="register-submit-btn" id="submitBtn">🌰 পণ্য বাজারে দিন</button>
<a href="products.html" class="back-link">← পণ্যের তালিকায় ফিরে যান</a>
</form></div></section>
<script>
const user=JSON.parse(localStorage.getItem("stmsUser"));if(!user){location.href="login.html";}
if(!["farmer","কৃষক","aratdar"].includes(String(user.role||"").toLowerCase())){alert("এই পেজটি শুধু বিক্রেতাদের জন্য।");location.href="products.html";}
const form=document.getElementById("productForm"),btn=document.getElementById("submitBtn");
form.addEventListener("submit",async e=>{
 e.preventDefault();btn.disabled=true;btn.textContent="⏳ যোগ হচ্ছে...";
 const productData={seller:user.id,sellerName:user.name,type:document.getElementById("type").value,quantity:Number(document.getElementById("quantity").value),pricePerKg:Number(document.getElementById("pricePerKg").value),location:document.getElementById("location").value.trim(),description:document.getElementById("description").value.trim()};
 try{const r=await fetch("http://localhost:5000/api/products/add",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(productData)});const data=await r.json();if(!r.ok)throw new Error(data.message||"পণ্য যোগ করা যায়নি");alert("✅ আপনার পণ্য সফলভাবে বাজারে যোগ হয়েছে!");form.reset();location.href="products.html";}catch(err){console.error(err);alert("❌ "+err.message);btn.disabled=false;btn.textContent="🌰 পণ্য বাজারে দিন";}
});
function logout(){localStorage.removeItem("stmsUser");localStorage.removeItem("stmsToken");location.href="login.html";}
</script>
</body></html>
