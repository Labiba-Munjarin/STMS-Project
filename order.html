<!DOCTYPE html>
<html lang="bn">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>অর্ডার দিন | STMS</title>

    <link
        rel="stylesheet"
        href="css/style.css">

    <style>

        body {
            background:
                linear-gradient(
                    135deg,
                    #f1f8ef,
                    #f8fbf7
                );
        }


        .order-page {
            max-width: 950px;
            margin: auto;
            padding: 35px 20px 70px;
        }


        .order-header {
            margin-bottom: 25px;
        }


        .order-header h1 {
            color: #174d2a;
            margin-bottom: 8px;
        }


        .order-header p {
            color: #68756b;
        }


        .order-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
        }


        .order-card {
            background: white;
            border-radius: 22px;
            padding: 25px;
            border: 1px solid #e1eadf;
            box-shadow:
                0 10px 30px
                rgba(25, 70, 35, 0.07);
        }


        .product-preview {
            background:
                linear-gradient(
                    135deg,
                    #eaf5e7,
                    #f8fbf6
                );

            border-radius: 18px;
            padding: 22px;
            margin-bottom: 20px;
        }


        .product-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }


        .product-preview h2 {
            margin: 0 0 8px;
            color: #174d2a;
        }


        .seller-name {
            color: #68756b;
            margin-bottom: 18px;
        }


        .product-details {
            display: grid;
            gap: 10px;
        }


        .detail {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 0;
            border-bottom:
                1px solid #dfe9dd;
        }


        .detail:last-child {
            border-bottom: none;
        }


        .detail span:last-child {
            font-weight: 700;
            color: #244b2c;
            text-align: right;
        }


        .form-title {
            margin-top: 0;
            color: #174d2a;
        }


        .form-group {
            margin-bottom: 18px;
        }


        .form-group label {
            display: block;
            font-weight: 700;
            margin-bottom: 7px;
            color: #304b35;
        }


        .form-group input,
        .form-group select {

            width: 100%;

            box-sizing: border-box;

            padding: 13px 14px;

            border:
                1px solid #d5e1d3;

            border-radius: 12px;

            font-size: 15px;

            outline: none;

            background: #fbfdfb;

        }


        .form-group input:focus,
        .form-group select:focus {

            border-color: #4c9556;

            box-shadow:
                0 0 0 3px
                rgba(
                    76,
                    149,
                    86,
                    0.10
                );

        }


        .price-summary {

            background: #eef7ec;

            border-radius: 16px;

            padding: 18px;

            margin: 20px 0;

        }


        .price-row {

            display: flex;

            justify-content: space-between;

            margin: 8px 0;

            color: #536056;

        }


        .total-row {

            border-top:
                1px solid #cddfca;

            padding-top: 12px;

            margin-top: 12px;

            font-size: 22px;

            font-weight: 800;

            color: #17652f;

        }


        .submit-btn {

            width: 100%;

            border: none;

            border-radius: 13px;

            padding: 14px;

            background: #246b38;

            color: white;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

        }


        .submit-btn:hover {
            background: #174d2a;
        }


        .submit-btn:disabled {

            background: #9eaaa0;

            cursor: not-allowed;

        }


        .back-link {

            display: block;

            text-align: center;

            margin-top: 15px;

            color: #246b38;

            text-decoration: none;

            font-weight: 600;

        }


        .message-box {

            background: white;

            border-radius: 18px;

            padding: 30px;

            text-align: center;

            border:
                1px solid #e1eadf;

        }


        .hidden {
            display: none !important;
        }


        .error-box {

            background: #fff0f0;

            color: #a52a2a;

            border:
                1px solid #f0cccc;

            border-radius: 14px;

            padding: 14px;

            margin-bottom: 18px;

            line-height: 1.6;

        }


        .select-product-btn {

            display: inline-block;

            margin-top: 15px;

            padding: 12px 20px;

            background: #246b38;

            color: white;

            border-radius: 10px;

            text-decoration: none;

            font-weight: 700;

        }


        @media (max-width: 750px) {

            .order-layout {
                grid-template-columns: 1fr;
            }

            .order-page {
                padding:
                    25px 15px 50px;
            }

        }

    </style>

</head>


<body>


<nav class="navbar">

    <div class="logo">
        STMS
    </div>


    <div class="nav-links">

        <a href="index.html">
            হোম
        </a>

        <a href="dashboard.html">
            ড্যাশবোর্ড
        </a>

        <a href="products.html">
            পণ্যসমূহ
        </a>

        <a href="orders.html">
            আমার অর্ডার
        </a>

        <a
            href="#"
            onclick="logout(); return false;">

            লগআউট

        </a>

    </div>

</nav>


<main class="order-page">


    <div class="order-header">

        <h1>
            🛒 সুপারির অর্ডার দিন
        </h1>

        <p>
            আপনার প্রয়োজনীয় পরিমাণ ও ডেলিভারির তথ্য দিন।
        </p>

    </div>


    <div
        id="loadingBox"
        class="message-box">

        ⏳ পণ্যের তথ্য লোড হচ্ছে...

    </div>


    <div
        id="errorBox"
        class="error-box hidden">

    </div>


    <div
        id="orderContent"
        class="order-layout hidden">


        <!-- ================================= -->
        <!-- PRODUCT -->
        <!-- ================================= -->

        <div class="order-card">

            <div
                id="productPreview"
                class="product-preview">

            </div>

        </div>


        <!-- ================================= -->
        <!-- ORDER FORM -->
        <!-- ================================= -->

        <div class="order-card">

            <h2 class="form-title">
                অর্ডারের তথ্য
            </h2>


            <form id="orderForm">


                <div class="form-group">

                    <label for="quantity">

                        📦 কত কেজি প্রয়োজন?

                    </label>


                    <input
                        type="number"
                        id="quantity"
                        min="1"
                        step="1"
                        placeholder="যেমন: ২০"
                        required>

                </div>


                <div class="form-group">

                    <label for="deliveryLocation">

                        📍 ডেলিভারির স্থান

                    </label>


                    <input
                        type="text"
                        id="deliveryLocation"
                        placeholder="যেমন: বরিশাল সদর"
                        required>

                </div>


                <div class="form-group">

                    <label for="paymentMethod">

                        💳 পেমেন্ট পদ্ধতি

                    </label>


                    <select
                        id="paymentMethod"
                        required>

                        <option value="">

                            পেমেন্ট পদ্ধতি নির্বাচন করুন

                        </option>


                        <option value="Cash on Delivery">

                            ক্যাশ অন ডেলিভারি

                        </option>

                    </select>

                </div>


                <!-- ================================= -->
                <!-- PRICE -->
                <!-- ================================= -->

                <div class="price-summary">


                    <div class="price-row">

                        <span>
                            প্রতি কেজি
                        </span>

                        <strong id="unitPrice">
                            ৳0
                        </strong>

                    </div>


                    <div class="price-row">

                        <span>
                            পরিমাণ
                        </span>

                        <strong id="quantitySummary">
                            0 KG
                        </strong>

                    </div>


                    <div class="price-row total-row">

                        <span>
                            মোট দাম
                        </span>

                        <strong id="totalPrice">
                            ৳0
                        </strong>

                    </div>


                </div>


                <button
                    type="submit"
                    class="submit-btn"
                    id="submitBtn">

                    🛒 অর্ডার নিশ্চিত করুন

                </button>


                <a
                    href="products.html"
                    class="back-link">

                    ← পণ্যের তালিকায় ফিরে যান

                </a>


            </form>

        </div>

    </div>

</main>


<script>


    // ==================================================
    // USER
    // ==================================================

    const user =
        JSON.parse(
            localStorage.getItem(
                "stmsUser"
            )
        );


    if (!user) {

        window.location.href =
            "login.html";

    }


    // ==================================================
    // GET PRODUCT ID
    // ==================================================

    const params =
        new URLSearchParams(
            window.location.search
        );


    const productId =
        params.get(
            "productId"
        );


    // ==================================================
    // VARIABLES
    // ==================================================

    let selectedProduct = null;


    // ==================================================
    // ELEMENTS
    // ==================================================

    const loadingBox =
        document.getElementById(
            "loadingBox"
        );


    const errorBox =
        document.getElementById(
            "errorBox"
        );


    const orderContent =
        document.getElementById(
            "orderContent"
        );


    const productPreview =
        document.getElementById(
            "productPreview"
        );


    const quantityInput =
        document.getElementById(
            "quantity"
        );


    const deliveryLocationInput =
        document.getElementById(
            "deliveryLocation"
        );


    const paymentMethodInput =
        document.getElementById(
            "paymentMethod"
        );


    const totalPriceElement =
        document.getElementById(
            "totalPrice"
        );


    const quantitySummary =
        document.getElementById(
            "quantitySummary"
        );


    const unitPrice =
        document.getElementById(
            "unitPrice"
        );


    const submitBtn =
        document.getElementById(
            "submitBtn"
        );


    const orderForm =
        document.getElementById(
            "orderForm"
        );


    // ==================================================
    // NUMBER FORMAT
    // ==================================================

    function formatNumber(value) {

        return Number(
            value || 0
        ).toLocaleString(
            "bn-BD"
        );

    }


    // ==================================================
    // PRODUCT TYPE
    // ==================================================

    function getBanglaType(type) {

        if (
            type ===
            "Fresh Supari"
        ) {

            return "কাঁচা সুপারি";

        }


        if (
            type ===
            "Dried Supari"
        ) {

            return "শুকনা সুপারি";

        }


        if (
            type ===
            "Processed Supari"
        ) {

            return "প্রক্রিয়াজাত সুপারি";

        }


        return type ||
            "সুপারি";

    }


    // ==================================================
    // ESCAPE HTML
    // ==================================================

    function escapeHtml(value) {

        return String(
            value ?? ""
        )

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

    }


    // ==================================================
    // SHOW ERROR
    // ==================================================

    function showError(message) {

        loadingBox.classList.add(
            "hidden"
        );


        orderContent.classList.add(
            "hidden"
        );


        errorBox.innerHTML = `

            ❌ ${escapeHtml(message)}

            <br>

            <a
                href="products.html"
                class="select-product-btn">

                🌰 পণ্য নির্বাচন করুন

            </a>

        `;


        errorBox.classList.remove(
            "hidden"
        );

    }


    // ==================================================
    // LOAD PRODUCT
    // ==================================================

    async function loadProduct() {


        /*
         * সবচেয়ে গুরুত্বপূর্ণ FIX
         *
         * order.html সরাসরি open করলে
         * productId থাকবে না।
         *
         * তখন products.html-এ পাঠিয়ে দেওয়া হবে।
         */

        if (!productId) {

            window.location.href =
                "products.html";

            return;

        }


        try {


            const response =
                await fetch(
                    "http://localhost:5000/api/products"
                );


            if (!response.ok) {

                throw new Error(
                    "পণ্য লোড করা যায়নি।"
                );

            }


            const products =
                await response.json();


            if (
                !Array.isArray(
                    products
                )
            ) {

                throw new Error(
                    "সঠিক product data পাওয়া যায়নি।"
                );

            }


            // =========================================
            // FIND SELECTED PRODUCT
            // =========================================

            selectedProduct =
                products.find(
                    product =>

                        String(
                            product._id
                        ) ===

                        String(
                            productId
                        )
                );


            if (!selectedProduct) {

                showError(
                    "পণ্যটি পাওয়া যায়নি।"
                );

                return;

            }


            // =========================================
            // OWN PRODUCT CHECK
            // =========================================

            if (

                String(
                    selectedProduct.seller
                ) ===

                String(
                    user.id
                )

            ) {

                showError(
                    "আপনি নিজের পণ্য অর্ডার করতে পারবেন না।"
                );

                return;

            }


            // =========================================
            // STOCK CHECK
            // =========================================

            const stock =
                Number(
                    selectedProduct.quantity ||
                    0
                );


            if (stock <= 0) {

                showError(
                    "এই পণ্যটি বর্তমানে স্টকে নেই।"
                );

                return;

            }


            // =========================================
            // SHOW CONTENT
            // =========================================

            loadingBox.classList.add(
                "hidden"
            );


            errorBox.classList.add(
                "hidden"
            );


            orderContent.classList.remove(
                "hidden"
            );


            // =========================================
            // PRICE
            // =========================================

            unitPrice.innerText =
                "৳" +

                formatNumber(
                    selectedProduct.pricePerKg
                );


            // =========================================
            // MAX QUANTITY
            // =========================================

            quantityInput.max =
                stock;


            // =========================================
            // DESCRIPTION
            // =========================================

            const description =

                selectedProduct.description

                    ? `

                        <p
                            style="
                                margin-top:18px;
                                color:#68756b;
                                line-height:1.6;
                            ">

                            ${escapeHtml(
                                selectedProduct.description
                            )}

                        </p>

                    `

                    : "";


            // =========================================
            // PRODUCT PREVIEW
            // =========================================

            productPreview.innerHTML = `

                <div class="product-icon">
                    🌰
                </div>


                <h2>

                    ${escapeHtml(
                        getBanglaType(
                            selectedProduct.type
                        )
                    )}

                </h2>


                <div class="seller-name">

                    👤 বিক্রেতা:

                    <strong>

                        ${escapeHtml(
                            selectedProduct.sellerName ||
                            "অজানা"
                        )}

                    </strong>

                </div>


                <div class="product-details">


                    <div class="detail">

                        <span>
                            📦 উপলব্ধ মজুদ
                        </span>

                        <span>

                            ${formatNumber(
                                stock
                            )}

                            KG

                        </span>

                    </div>


                    <div class="detail">

                        <span>
                            💰 প্রতি কেজি
                        </span>

                        <span>

                            ৳${formatNumber(
                                selectedProduct.pricePerKg
                            )}

                        </span>

                    </div>


                    <div class="detail">

                        <span>
                            📍 স্থান
                        </span>

                        <span>

                            ${escapeHtml(
                                selectedProduct.location ||
                                "—"
                            )}

                        </span>

                    </div>


                    <div class="detail">

                        <span>
                            🌰 ধরন
                        </span>

                        <span>

                            ${escapeHtml(
                                getBanglaType(
                                    selectedProduct.type
                                )
                            )}

                        </span>

                    </div>


                </div>


                ${description}

            `;

        }


        catch (error) {

            console.error(
                "Load Product Error:",
                error
            );


            showError(
                "সার্ভারের সাথে সংযোগ করা যাচ্ছে না। Backend চালু আছে কিনা নিশ্চিত করুন।"
            );

        }

    }


    // ==================================================
    // UPDATE TOTAL
    // ==================================================

    function updateTotal() {


        if (!selectedProduct) {
            return;
        }


        let quantity =
            Number(
                quantityInput.value
            ) || 0;


        const stock =
            Number(
                selectedProduct.quantity ||
                0
            );


        if (
            quantity > stock
        ) {

            quantity =
                stock;

            quantityInput.value =
                stock;

        }


        if (
            quantity < 0
        ) {

            quantity =
                0;

            quantityInput.value =
                "";

        }


        const pricePerKg =
            Number(
                selectedProduct.pricePerKg ||
                0
            );


        const total =
            quantity *
            pricePerKg;


        quantitySummary.innerText =
            formatNumber(
                quantity
            ) +
            " KG";


        totalPriceElement.innerText =
            "৳" +
            formatNumber(
                total
            );

    }


    quantityInput.addEventListener(
        "input",
        updateTotal
    );


    // ==================================================
    // PLACE ORDER
    // ==================================================

    orderForm.addEventListener(
        "submit",
        async function(event) {


            event.preventDefault();


            if (!selectedProduct) {

                alert(
                    "পণ্যের তথ্য পাওয়া যায়নি।"
                );

                return;

            }


            const quantity =
                Number(
                    quantityInput.value
                );


            const deliveryLocation =
                deliveryLocationInput.value
                    .trim();


            const paymentMethod =
                paymentMethodInput.value;


            const stock =
                Number(
                    selectedProduct.quantity ||
                    0
                );


            // =========================================
            // VALIDATE QUANTITY
            // =========================================

            if (

                !Number.isFinite(
                    quantity
                ) ||

                quantity <= 0

            ) {

                alert(
                    "দয়া করে সঠিক পরিমাণ দিন।"
                );

                quantityInput.focus();

                return;

            }


            // =========================================
            // STOCK
            // =========================================

            if (
                quantity > stock
            ) {

                alert(

                    "বর্তমানে মাত্র " +

                    stock +

                    " KG স্টকে আছে।"

                );

                quantityInput.focus();

                return;

            }


            // =========================================
            // LOCATION
            // =========================================

            if (
                !deliveryLocation
            ) {

                alert(
                    "দয়া করে ডেলিভারির স্থান দিন।"
                );

                deliveryLocationInput.focus();

                return;

            }


            // =========================================
            // PAYMENT
            // =========================================

            if (
                !paymentMethod
            ) {

                alert(
                    "দয়া করে পেমেন্ট পদ্ধতি নির্বাচন করুন।"
                );

                paymentMethodInput.focus();

                return;

            }


            // =========================================
            // OWN PRODUCT
            // =========================================

            if (

                String(
                    selectedProduct.seller
                ) ===

                String(
                    user.id
                )

            ) {

                alert(
                    "আপনি নিজের পণ্য অর্ডার করতে পারবেন না।"
                );

                return;

            }


            // =========================================
            // DISABLE BUTTON
            // =========================================

            submitBtn.disabled =
                true;


            submitBtn.innerText =
                "⏳ অর্ডার দেওয়া হচ্ছে...";


            try {


                const token =
                    localStorage.getItem(
                        "stmsToken"
                    );


                // =====================================
                // SEND ORDER
                // =====================================

                const response =
                    await fetch(

                        "http://localhost:5000/api/orders/place",

                        {

                            method:
                                "POST",


                            headers: {

                                "Content-Type":
                                    "application/json",


                                ...(token

                                    ? {

                                        "Authorization":
                                            "Bearer " +
                                            token

                                      }

                                    : {})

                            },


                            body:
                                JSON.stringify({

                                    productId:
                                        selectedProduct._id,


                                    buyer:
                                        user.id,


                                    buyerName:
                                        user.name ||
                                        user.nameBn ||
                                        "ক্রেতা",


                                    quantity:
                                        quantity,


                                    deliveryLocation:
                                        deliveryLocation,


                                    paymentMethod:
                                        paymentMethod

                                })

                        }

                    );


                // =====================================
                // RESPONSE
                // =====================================

                let data = {};


                try {

                    data =
                        await response.json();

                }

                catch (jsonError) {

                    data = {};

                }


                if (
                    !response.ok
                ) {

                    throw new Error(

                        data.message ||

                        "অর্ডার দেওয়া যায়নি।"

                    );

                }


                // =====================================
                // SUCCESS
                // =====================================

                alert(
                    "✅ আপনার অর্ডার সফলভাবে দেওয়া হয়েছে!"
                );


                window.location.href =
                    "orders.html";


            }


            catch (error) {


                console.error(
                    "Place Order Error:",
                    error
                );


                alert(

                    "❌ " +

                    (

                        error.message ||

                        "অর্ডার দেওয়া যায়নি।"

                    )

                );


                submitBtn.disabled =
                    false;


                submitBtn.innerText =
                    "🛒 অর্ডার নিশ্চিত করুন";

            }

        }

    );


    // ==================================================
    // LOGOUT
    // ==================================================

    function logout() {


        localStorage.removeItem(
            "stmsUser"
        );


        localStorage.removeItem(
            "stmsToken"
        );


        window.location.href =
            "login.html";

    }


    // ==================================================
    // START
    // ==================================================

    loadProduct();

</script>
