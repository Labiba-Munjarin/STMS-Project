<!DOCTYPE html>
<html lang="bn">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>লগইন | STMS</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body>


    <nav class="navbar">

        <div class="logo">
            STMS
        </div>

        <div class="nav-links">

            <a href="index.html">
                হোম
            </a>

            <a href="index.html#about">
                পরিচিতি
            </a>

            <a href="index.html#features">
                সুবিধা
            </a>

            <a href="login.html">
                লগইন
            </a>

            <a href="register.html"
               class="register-btn">
                নিবন্ধন
            </a>

        </div>

    </nav>



    <section class="register-section">

        <div class="register-container">

            <h1>
                স্বাগতম
            </h1>

            <p class="register-subtitle">
                আপনার STMS অ্যাকাউন্টে লগইন করুন
            </p>


            <form id="loginForm">


                <div class="form-group">

                    <label for="login-email">
                        ইমেইল ঠিকানা
                    </label>

                    <input
                        type="email"
                        id="login-email"
                        placeholder="আপনার ইমেইল লিখুন"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="login-password">
                        পাসওয়ার্ড
                    </label>

                    <input
                        type="password"
                        id="login-password"
                        placeholder="আপনার পাসওয়ার্ড লিখুন"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="register-submit-btn">

                    লগইন

                </button>


            </form>


            <p class="login-text">

                অ্যাকাউন্ট নেই?

                <a href="register.html">
                    নিবন্ধন
                </a>

            </p>

        </div>

    </section>



    <footer>

        <p>
            © 2026 সুপারি ট্রেডিং ম্যানেজমেন্ট সিস্টেম
        </p>

    </footer>


    <script src="js/script.js"></script>

</body>

</html>
